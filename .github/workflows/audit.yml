name: Security audit

on:
  push:
    paths: ["**/Cargo.toml", "**/Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "**/Cargo.lock"]
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC, catches new advisories without a push
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cargo.lock is gitignored (this is a library workspace), so cargo-audit
      # has nothing to read unless we resolve one first.
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
